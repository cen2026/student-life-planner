<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Life Planner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
            margin: 0;
        }
        .planner-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; }

        /* 顶部 Tab 切换 */
        .tab-bar {
            display: flex;
            border-bottom: 2px solid #eaedf1;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 表单与输入 */
        .input-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input, select {
            padding: 9px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: #3b82f6; }
        .flex-1 { flex: 1; }

        button.action-btn {
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button.action-btn:hover { background-color: #2563eb; }

        /* 筛选栏 */
        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: #6b7280;
        }

        /* 列表公用样式 */
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #eaedf1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        li.overdue {
            border-left: 4px solid #ef4444;
            background: #fff5f5;
        }
        .task-left {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .task-title {
            font-size: 15px;
            color: #1f2937;
            font-weight: 500;
        }
        .task-meta {
            font-size: 12px;
            color: #6b7280;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .tag {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .due-text.is-overdue {
            color: #dc2626;
            font-weight: 600;
        }
        .completed .task-title {
            text-decoration: line-through;
            color: #9ca3af;
        }
        .completed .tag {
            background-color: #f3f4f6;
            color: #9ca3af;
        }

        /* 记账样式 */
        .expense-total {
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .expense-amount {
            font-weight: bold;
            color: #ef4444;
            margin-right: 10px;
        }

        .delete-btn {
            background: transparent;
            color: #9ca3af;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .delete-btn:hover {
            color: #ef4444;
            background-color: #fee2e2;
        }
    </style>
</head>
<body>

<div class="planner-card">
    <h2>Campus Life Planner</h2>

    <!-- Tab 导航 -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('tasks')">Assignments & Tasks</button>
        <button class="tab-btn" onclick="switchTab('expenses')">Daily Expenses</button>
    </div>

    <!-- 面板 1：待办管理 -->
    <div id="tab-tasks" class="tab-content active">
        <div class="input-form">
            <input type="text" id="taskInput" placeholder="Assignment or Exam title...">
            <div class="input-row">
                <select id="subjectInput" class="flex-1">
                    <option value="GENERAL">General</option>
                    <option value="OS">Operating Systems</option>
                    <option value="ELECTIVE">Elective Course</option>
                    <option value="OTHERS">Others</option>
                </select>
                <input type="date" id="dateInput" class="flex-1">
            </div>
            <button class="action-btn" onclick="addTask()">Add Assignment</button>
        </div>

        <div class="filter-row">
            <span>Filter by Subject:</span>
            <select id="filterSelect" onchange="renderTasks()">
                <option value="ALL">All Subjects</option>
                <option value="GENERAL">General</option>
                <option value="OS">Operating Systems</option>
                <option value="ELECTIVE">Elective Course</option>
                <option value="OTHERS">Others</option>
            </select>
        </div>

        <ul id="taskList"></ul>
    </div>

    <!-- 面板 2：日用记账 -->
    <div id="tab-expenses" class="tab-content">
        <div class="expense-total" id="totalExpenseDisplay">Total Spent: RM 0.00</div>

        <div class="input-form">
            <input type="text" id="expenseTitleInput" placeholder="Item (e.g. Lunch, Bus, Notebook)...">
            <div class="input-row">
                <select id="expenseCategoryInput" class="flex-1">
                    <option value="Food">Food & Beverage</option>
                    <option value="Transport">Transport</option>
                    <option value="Study">Study Materials</option>
                    <option value="Others">Others</option>
                </select>
                <input type="number" id="expenseAmountInput" placeholder="RM Amount" step="0.10" class="flex-1">
            </div>
            <button class="action-btn" onclick="addExpense()">Record Expense</button>
        </div>

        <ul id="expenseList"></ul>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        renderTasks();
        renderExpenses();
    });

    // 选项卡切换
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'tasks') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-tasks').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-expenses').classList.add('active');
        }
    }

    /* ================= 待办任务逻辑 ================= */
    function getStoredTasks() {
        let tasks = localStorage.getItem("planner_tasks_v2");
        return tasks ? JSON.parse(tasks) : [];
    }

    function saveTasks(tasks) {
        localStorage.setItem("planner_tasks_v2", JSON.stringify(tasks));
    }

    function renderTasks() {
        const list = document.getElementById("taskList");
        list.innerHTML = "";
        const tasks = getStoredTasks();
        const filter = document.getElementById("filterSelect").value;
        const todayStr = new Date().toISOString().split('T')[0];

        tasks.forEach((task, index) => {
            if (filter !== "ALL" && task.subject !== filter) return;

            const li = document.createElement("li");
            const isOverdue = task.dueDate && task.dueDate < todayStr && !task.completed;
            if (isOverdue) li.classList.add("overdue");
            if (task.completed) li.classList.add("completed");

            const leftDiv = document.createElement("div");
            leftDiv.className = "task-left";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            checkbox.onchange = () => toggleTask(index);

            const infoDiv = document.createElement("div");
            infoDiv.className = "task-info";

            const title = document.createElement("div");
            title.className = "task-title";
            title.textContent = task.text;

            const meta = document.createElement("div");
            meta.className = "task-meta";

            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = task.subject;
            meta.appendChild(tag);

            if (task.dueDate) {
                const due = document.createElement("span");
                due.className = `due-text ${isOverdue ? 'is-overdue' : ''}`;
                due.textContent = isOverdue ? `Overdue: ${task.dueDate}` : `Due: ${task.dueDate}`;
                meta.appendChild(due);
            }

            infoDiv.appendChild(title);
            infoDiv.appendChild(meta);
            leftDiv.appendChild(checkbox);
            leftDiv.appendChild(infoDiv);

            const delBtn = document.createElement("button");
            delBtn.className = "delete-btn";
            delBtn.innerHTML = "&times;";
            delBtn.onclick = () => deleteTask(index);

            li.appendChild(leftDiv);
            li.appendChild(delBtn);
            list.appendChild(li);
        });
    }

    function addTask() {
        const taskInput = document.getElementById("taskInput");
        const subjectInput = document.getElementById("subjectInput");
        const dateInput = document.getElementById("dateInput");

        const text = taskInput.value.trim();
        if (!text) return;

        const tasks = getStoredTasks();
        tasks.push({
            text: text,
            subject: subjectInput.value,
            dueDate: dateInput.value,
            completed: false
        });

        tasks.sort((a, b) => {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
        });

        saveTasks(tasks);
        taskInput.value = "";
        dateInput.value = "";
        renderTasks();
    }

    function toggleTask(index) {
        const tasks = getStoredTasks();
        tasks[index].completed = !tasks[index].completed;
        saveTasks(tasks);
        renderTasks();
    }

    function deleteTask(index) {
        const tasks = getStoredTasks();
        tasks.splice(index, 1);
        saveTasks(tasks);
        renderTasks();
    }

    /* ================= 记账功能逻辑 ================= */
    function getStoredExpenses() {
        let expenses = localStorage.getItem("planner_expenses_v1");
        return expenses ? JSON.parse(expenses) : [];
    }

    function saveExpenses(expenses) {
        localStorage.setItem("planner_expenses_v1", JSON.stringify(expenses));
    }

    function renderExpenses() {
        const list = document.getElementById("expenseList");
        list.innerHTML = "";
        const expenses = getStoredExpenses();
        let total = 0;

        expenses.forEach((item, index) => {
            total += parseFloat(item.amount) || 0;

            const li = document.createElement("li");

            const infoDiv = document.createElement("div");
            infoDiv.className = "task-info";

            const title = document.createElement("div");
            title.className = "task-title";
            title.textContent = item.title;

            const meta = document.createElement("div");
            meta.className = "task-meta";

            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = item.category;
            meta.appendChild(tag);

            infoDiv.appendChild(title);
            infoDiv.appendChild(meta);

            const rightDiv = document.createElement("div");
            rightDiv.style.display = "flex";
            rightDiv.style.alignItems = "center";

            const amountSpan = document.createElement("span");
            amountSpan.className = "expense-amount";
            amountSpan.textContent = `- RM ${parseFloat(item.amount).toFixed(2)}`;

            const delBtn = document.createElement("button");
            delBtn.className = "delete-btn";
            delBtn.innerHTML = "&times;";
            delBtn.onclick = () => deleteExpense(index);

            rightDiv.appendChild(amountSpan);
            rightDiv.appendChild(delBtn);

            li.appendChild(infoDiv);
            li.appendChild(rightDiv);
            list.appendChild(li);
        });

        document.getElementById("totalExpenseDisplay").textContent = `Total Spent: RM ${total.toFixed(2)}`;
    }

    function addExpense() {
        const titleInput = document.getElementById("expenseTitleInput");
        const categoryInput = document.getElementById("expenseCategoryInput");
        const amountInput = document.getElementById("expenseAmountInput");

        const title = titleInput.value.trim();
        const amount = parseFloat(amountInput.value);

        if (!title || isNaN(amount) || amount <= 0) {
            alert("Please enter a valid expense description and amount!");
            return;
        }

        const expenses = getStoredExpenses();
        expenses.unshift({
            title: title,
            category: categoryInput.value,
            amount: amount
        });

        saveExpenses(expenses);
        titleInput.value = "";
        amountInput.value = "";
        renderExpenses();
    }

    function deleteExpense(index) {
        const expenses = getStoredExpenses();
        expenses.splice(index, 1);
        saveExpenses(expenses);
        renderExpenses();
    }
</script>

</body>
</html>
